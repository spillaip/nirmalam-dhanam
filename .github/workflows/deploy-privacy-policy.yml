name: Deploy privacy policy

on:
  push:
    branches: [main]
    paths:
      - 'docs/privacy-policy.html'
      - '.github/workflows/deploy-privacy-policy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The repository owner must enable Settings → Pages → GitHub Actions once.
      # `enablement: true` would require a separately managed PAT, not GITHUB_TOKEN.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
